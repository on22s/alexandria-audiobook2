# Bandit (Python security linter) for the server and upload surface.
#
# Run locally, from app/ (Linux or macOS; any Python 3.10 environment):
#
#   python -m pip install -r requirements-security.txt
#   bandit --ini bandit.ini -r -f json -o bandit-report.json \
#          -b bandit-baseline.json --severity-level medium
#
# Bandit probes the targets below. Findings already reviewed on main live in
# bandit-baseline.json, so the command exits 1 only when a NEW medium-or-higher
# finding appears. Exit 0 means clean. `bandit-report.json` lists every
# remaining finding (e.g. if one of the accepted items moved into a different
# file or issue text, it shows up as new).
#
# Scope, for now: the HTTP app and its routers, EPUB/TXT/DOCX/Calibre import,
# archive handling, and the modules those paths use to run subprocesses or open
# request-supplied paths. Deliberately NOT scanned yet: app/tests/,
# app/experiments/, tools/, and CI/benchmark harnesses (they do not run on
# request input).
#
# Accepted existing findings (all reviewed, see bandit-baseline.json):
#   B314 xml.etree on EPUB/DOCX/OPDS XML (16) - inputs are size-bounded by
#        validate_epub_archive (512 MB archive / 256 MB expanded / ratio cap),
#        docx_preview's BoundedTree, and calibre_opds' feed cap plus its own
#        DOCTYPE rejection. ElementTree never resolves external entities, and
#        the bundled expat (>=2.4) rejects entity-amplification bombs.
#   B104 "bind all interfaces" (2) - lmstudio_settings only parses/validates
#        host names; it never calls bind() with these values.
#   B108 temp dir literal "/tmp" (1) - created with tempfile.TemporaryDirectory,
#        which is private and unpredictable.
#   B113 "requests without timeout" (1) - local variable `requests` is a dict.
#   B324 SHA-1 (1) - filename-shortening suffix, not a security hash.
#   B301 pickle (1) - voice_analysis_cache reads a cache file this app wrote in
#        its own data directory, never bytes from a request.
[bandit]
targets = app.py,core.py,routers,epub_package.py,epub_readaloud.py,epub_publication.py,epub_extraction_report.py,calibre_import.py,calibre_opds.py,docx_preview.py,archive_utils.py,book_recovery_archive.py,source_encoding.py,source_upload_publication.py,source_upload_stage.py,upload_operation.py,sound_design_uploads.py,voice_reference_import.py,voice_reference.py,request_origin.py,project_scope_files.py,project_scope_admission.py,media_process.py,audio_ffmpeg.py,m4b_encode.py,m4b_mux_worker.py,pcm_mux_worker.py,audio_channels.py,audio_source_io.py,subprocess_ownership.py,windows_subprocess_owner.py,macos_subprocess_owner.py,external_tts_client.py,llm_provider.py,voice_analysis_cache.py,synthesis_recovery_cache.py,utils.py,lmstudio_settings.py
exclude = tests,experiments
