# Bandit (Python security linter) for the server app and the repo-root scripts.
#
# WHAT IS SCANNED
# Everything that runs: every *.py under app/ and every *.py in the repository
# root. The target list is built by app/bandit_gate.py from the filesystem, so
# a new module or a renamed file is scanned without editing this file. There is
# no hand-curated module list and no baseline file.
#
# The gate passes explicit, relative POSIX paths (not the app/ directory), so
# the exclude globs below match on Windows as well as Linux. A virtualenv
# inside app/ is never a target: the gate skips any tree that holds pyvenv.cfg
# and any path with a site-packages/dist-packages component, so the live
# checkout's app/env (tens of thousands of third-party modules) is not scanned.
#
# WHAT IS EXCLUDED, AND WHY
#   app/tests/*                      tests, not runtime code
#   app/experiments/*                research scripts, not app runtime
#   tools/*                          developer tooling, not shipped or request-driven
#   app/benchmark_runner.py          CI/benchmark harness: builds remote
#                                    mktemp/ssh staging roots for benchmark
#                                    workers; its "/tmp" literals name remote
#                                    or validated local output roots, not files
#                                    created from request input.
#   app/run_isolated_api_tests.py    CI harness: runs the isolated API test
#                                    suite; its urlopen only receives
#                                    loopback/file URLs chosen by the runner.
#
# HOW FINDINGS ARE HANDLED
# Reviewed, accepted findings carry the reason on the line ABOVE the code and
# an id-only nosec comment on the finding's own line:
#
#   # <one-line reason>
#   statement  # nosec BXXX
#
# The id must be alone. Bandit parses every token after "nosec", so a reason
# on the same line that names another test id or plugin would suppress that
# test too (e.g. appending "B602" to a B314 comment hides a HIGH B602). The
# gate rejects any other nosec shape, and a test pins the convention.
#
# nosec is per line and per test ID, so a second instance of the same pattern
# anywhere else has no nosec and fails the gate. Accepted classes:
#   B314 xml.etree (16 findings on 14 lines: epub_package.py 3,
#        epub_readaloud.py 7, routers/script.py 2, docx_preview.py 1
#        line/2 findings, calibre_opds.py 1 line/2 findings)
#        Every input is size-bounded first: validate_epub_archive caps the
#        archive at 512 MB / 256 MB expanded / an expansion ratio,
#        epub_readaloud reads members through _read_archive_member_bounded,
#        docx_preview uses BoundedTree + MAX_XML, and calibre_opds caps feed
#        bytes and rejects any DOCTYPE. ElementTree never resolves external
#        entities and the bundled expat (>=2.6) rejects entity-amplification
#        bombs.
#   B104 lmstudio_settings.py 2 - host allowlist / netstat parsing, no bind().
#   B108 macos_subprocess_owner.py 1 - tempfile.TemporaryDirectory is private
#        and unpredictable.
#   B113 synthesis_recovery_cache.py 1 - local dict named `requests`.
#   B301 voice_analysis_cache.py 1 - app-written cache file, never request
#        bytes.
#   B615 6 - app/hf_utils.py 2 fetch the builtin-adapter catalog from the
#        constant repo Finrandojin/Alexandria; pinning a revision would freeze
#        later adapter updates for existing installs, so it is accepted, not
#        changed. alexandria_preparer_rocm_compatible.py 2 already pass
#        revision=WAV2VEC2_MODEL_REVISION (a 40-hex SHA) and bandit only
#        recognises a literal. download_model.py 2 are an offline developer
#        downloader (staged and size-checked) and a local-path processor load.
# The SHA-1 finding at utils.py is fixed in code with usedforsecurity=False.
#
# RUN IT LOCALLY (from the repository root; bandit is tool-only, never a
# runtime dependency):
#
#   python -m pip install -r app/requirements-security.txt
#   python app/bandit_gate.py
#
# It prints how many files it scanned, writes app/bandit-report.json, and exits
# 1 when any medium-or-higher finding, any file bandit could not parse/read, or
# any non-conforming nosec comment is reported. LOW findings are counted in the
# report metrics only (--severity-level medium keeps them out of "results"), so
# they do not gate.

[bandit]
exclude = app/tests/*,app/experiments/*,tools/*,app/benchmark_runner.py,app/run_isolated_api_tests.py
