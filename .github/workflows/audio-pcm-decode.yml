name: independent audio decoding
on:
  pull_request:
    paths:
      - 'app/audio_pcm_decode.py'
      - 'app/audio_source_io.py'
      - 'app/media_process.py'
      - 'app/audio_take_history.py'
      - 'app/take_publication.py'
      - 'app/train_lora.py'
      - 'app/export_quality.py'
      - 'app/subprocess_ownership.py'
      - 'app/*subprocess_owner.py'
      - 'app/tests/test_audio_pcm_decode.py'
      - 'app/tests/test_media_process.py'
      - 'app/tests/test_media_output_sink.py'
      - 'app/tests/test_export_quality.py'
      - '.github/workflows/audio-pcm-decode.yml'
permissions:
  contents: read
jobs:
  native:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Install native CPU audio dependencies
        run: python -m pip install 'numpy==2.2.6' 'soundfile==0.14.0' 'pydub==0.25.1' 'pydantic==2.12.5'
      - name: Install FFmpeg on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install FFmpeg on macOS
        if: runner.os == 'macOS'
        run: command -v ffmpeg || brew install ffmpeg
      - name: Install FFmpeg on Windows
        if: runner.os == 'Windows'
        run: choco install ffmpeg --no-progress -y
      - name: Record native codec versions
        run: |
          ffmpeg -version
          ffprobe -version
          python -c "import soundfile; print(soundfile.__version__, soundfile.__libsndfile_version__)"
      - name: Verify admitted input, PCM integrity and owned cleanup
        run: python -m unittest tests.test_audio_pcm_decode tests.test_media_process tests.test_media_output_sink tests.test_export_quality -v
