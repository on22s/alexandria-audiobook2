name: macOS subprocess ownership

# Native subprocess containment and caller checks, CPU only.
# Model construction is stubbed; native ownership and kernel leases are real.
on:
  pull_request:
    paths:
      - '.github/workflows/macos-owner-probe.yml'
      - 'tools/diagnostics/macos_369_native_probe.py'
      - 'tools/diagnostics/macos_369_owner_checks.py'
      - 'tools/diagnostics/macos_369_callers_checks.py'
      - 'app/subprocess_ownership.py'
      - 'app/core.py'
      - 'app/benchmark_execution.py'
      - 'app/task_ownership.py'
      - 'app/experiments/gpu_guard.py'
      - 'alexandria_file_lock.py'
      - 'app/macos_subprocess_kernel.py'
      - 'app/macos_subprocess_owner.py'

permissions:
  contents: read

jobs:
  native-prerequisites:
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Measure ordinary-user native ownership prerequisites
        run: python tools/diagnostics/macos_369_native_probe.py > macos-owner-probe.log 2>&1
      - name: Verify production macOS subprocess owner
        run: python tools/diagnostics/macos_369_owner_checks.py > macos-owner-checks.log 2>&1
      - name: Install CPU caller dependencies
        run: python -m pip install 'fastapi==0.128.0' 'pydantic==2.12.5' 'aiofiles==24.1.0' 'numpy==2.2.6' 'soundfile==0.13.1'
      - name: Verify actual app and benchmark ownership callers
        run: python tools/diagnostics/macos_369_callers_checks.py > macos-caller-checks.log 2>&1
      - name: Retain actual probe measurements and errors
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: macos-owner-prerequisites
          path: |
            macos_369_native_probe_result.json
            macos-owner-probe.log
            macos_369_owner_result.json
            macos-owner-checks.log
            macos_369_callers_result.json
            macos-caller-checks.log
          if-no-files-found: error
