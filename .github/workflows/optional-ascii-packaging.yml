name: optional ASCII packaging
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tools/optional_ascii/**'
      - 'app/ascii_speech_native.py'
      - 'app/speech_policy.py'
      - 'app/speech_text.py'
      - 'app/pronunciation.py'
      - '.github/workflows/optional-ascii-packaging.yml'
permissions:
  contents: read
concurrency:
  group: optional-ascii-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  package:
    # Standard public-repository runners only; no uploads or publication.
    if: github.repository == 'on22s/alexandria-audiobook2' && github.event.repository.private == false
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        python: ['3.10', '3.12']
        runner: [ubuntu-24.04, windows-2022, macos-15, macos-15-intel]
        include:
          - runner: ubuntu-24.04
            architecture: x86_64
          - runner: windows-2022
            architecture: x86_64
          - runner: macos-15
            architecture: arm64
          - runner: macos-15-intel
            architecture: x86_64
          # Negative lane only; shares this matrix's max-two concurrency.
          - runner: ubuntu-24.04
            python: '3.13t'
            architecture: x86_64
    env:
      # Preserve committed bytes on Windows before sdist provenance checks.
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
      CARGO_BUILD_JOBS: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Provision pinned official tooling and locked crates
        shell: bash
        run: |
          python -m pip install --only-binary=:all: --require-hashes --index-url https://pypi.org/simple -r tools/optional_ascii/build-tools.txt
          rustup toolchain install 1.96.0 --profile minimal --no-self-update
          rustup override set 1.96.0
          cargo fetch --locked --manifest-path tools/optional_ascii/Cargo.toml
      - name: Qualify source archive, wheel and clean runtime
        if: matrix.python != '3.13t'
        shell: bash
        run: |
          python tools/optional_ascii/qualify.py --architecture '${{ matrix.architecture }}' --work "${{ runner.temp }}/ascii-package-${{ matrix.python }}"
      - name: Verify actual free-threaded build rejection and pre-import fallback
        if: matrix.python == '3.13t'
        shell: bash
        run: |
          python tools/optional_ascii/check_free_threaded.py --work "${{ runner.temp }}/ascii-free-threaded-rejection"
