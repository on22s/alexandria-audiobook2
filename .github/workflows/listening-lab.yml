name: listening lab

on:
  pull_request:
    paths:
      - 'tools/listening_lab/**'
      - '.github/workflows/listening-lab.yml'

permissions:
  contents: read

jobs:
  verifiers:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: tools/listening_lab
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '26'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Verify instrument and independent reference
        run: node verify-lab.cjs
      - name: Verify interface workflows
        if: always()
        run: node verify-interface.cjs
      - name: Verify pending-playback ordering
        if: always()
        run: node verify-playback-race.cjs
