name: native audio integrity
on:
  pull_request:
    paths:
      - 'app/sound_design_*.py'
      - 'app/export_quality.py'
      - 'app/m4b_cover.py'
      - 'app/m4b_publication.py'
      - 'app/project.py'
      - 'app/tests/test_m4b_source_publication.py'
      - 'app/tests/test_m4b_cover_pixel_budget.py'
      - 'app/tests/test_m4b_cover_admission.py'
      - 'tools/verify_m4b_cover_output.py'
      - 'app/subprocess_ownership.py'
      - 'app/*subprocess_owner.py'
      - 'app/audio_take_history.py'
      - 'app/utils.py'
      - 'app/audio_pcm_producer.py'
      - 'app/audio_source_io.py'
      - 'app/source_evidence.py'
      - 'app/json_metadata.py'
      - 'app/adapter_publication.py'
      - 'app/project_scope_files.py'
      - 'app/audio_generation_owner.py'
      - 'app/tests/test_sound_design_cues.py'
      - 'app/tests/test_sound_design_assets.py'
      - 'app/tests/test_sound_design_decode.py'
      - 'app/tests/test_media_output_sink.py'
      - 'app/tests/test_sound_design_mix.py'
      - '.github/workflows/sound-assets.yml'
      - 'app/audio_pcm_decode.py'
      - 'app/audio_pcm_mux.py'
      - 'app/audio_m4b_pcm.py'
      - 'app/pcm_*.py'
      - 'app/m4b_mux_*.py'
      - 'app/m4b_worker_request.py'
      - 'app/bounded_media_io.py'
      - 'app/audio_encoder_identity.py'
      - 'app/audio_mastering*.py'
      - 'app/tests/test_pcm_mux_worker.py'
      - 'app/tests/test_audio_pcm_mux.py'
      - 'app/tests/test_audio_m4b_pcm.py'
      - 'app/tests/test_m4b_worker_request.py'
      - 'app/media_process.py'
      - 'app/take_publication.py'
      - 'app/train_lora.py'
      - 'app/tests/test_audio_pcm_decode.py'
      - 'app/tests/test_media_process.py'
      - 'app/tests/test_export_quality.py'
      - '.github/workflows/audio-pcm-decode.yml'
permissions:
  contents: read
jobs:
  native:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Install native CPU audio dependencies
        run: python -m pip install 'numpy==2.2.6' 'soundfile==0.14.0' 'pydub==0.25.1' 'pydantic==2.12.5' 'Pillow==12.3.0' 'av==17.0.0'
      - name: Cache FFmpeg packages on Linux
        if: runner.os == 'Linux'
        uses: actions/cache@v5
        with:
          path: ~/apt-archives
          key: apt-ffmpeg-${{ runner.os }}-v1
      - name: Install FFmpeg on Linux
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          if command -v ffmpeg && command -v ffprobe; then
            exit 0
          fi
          # Reuse the established package cache from tests.yml. A slow mirror
          # must not force every native audio job to download the same codecs.
          mkdir -p ~/apt-archives/partial
          if ls ~/apt-archives/*.deb >/dev/null 2>&1; then
            sudo dpkg -i ~/apt-archives/*.deb || sudo apt-get install -f -y
          else
            for attempt in 1 2 3; do
              if sudo apt-get update && sudo apt-get install -y --no-install-recommends \
                  -o Dir::Cache::archives="$HOME/apt-archives" ffmpeg; then
                break
              fi
              echo "FFmpeg package setup attempt $attempt failed; retrying"
              sleep "$((attempt * 10))"
            done
            sudo chown -R "$USER" ~/apt-archives
            rm -rf ~/apt-archives/partial ~/apt-archives/lock
          fi
          command -v ffmpeg
          command -v ffprobe
      - name: Install FFmpeg on macOS
        if: runner.os == 'macOS'
        run: command -v ffmpeg || brew install ffmpeg
      - name: Install FFmpeg on Windows
        if: runner.os == 'Windows'
        run: choco install ffmpeg --no-progress -y
      - name: Record native codec versions
        run: |
          ffmpeg -version
          ffprobe -version
          python -c "import soundfile; print(soundfile.__version__, soundfile.__libsndfile_version__)"
      - name: Verify exact decoding, owned child cleanup and durable recovery
        run: python -m unittest tests.test_audio_pcm_decode tests.test_media_process tests.test_export_quality tests.test_sound_design_assets tests.test_sound_design_decode tests.test_media_output_sink tests.test_sound_design_mix tests.test_sound_design_cues tests.test_pcm_mux_worker tests.test_audio_pcm_mux tests.test_audio_m4b_pcm tests.test_m4b_worker_request -v
      - name: Verify selected cover pixels in actual finished M4B output
        run: python ../tools/verify_m4b_cover_output.py
      - name: Verify cover pixel budgets during overlapping validation
        run: python -m unittest tests.test_m4b_cover_pixel_budget -v
