name: security lint
on:
  pull_request:
  merge_group:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  bandit:
    name: bandit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: app/requirements-security.txt
      - name: Install pinned Bandit
        run: python -m pip install -r requirements-security.txt
      - name: Fail on findings or unscannable files
        # Scans non-excluded app/ modules (skipping virtualenvs and the paths
        # excluded in app/bandit.ini) plus the repo-root scripts, with no
        # baseline file. Fails on any medium-or-higher finding, any file bandit
        # could not parse or read, any blanket nosec suppression, or any nosec
        # comment that does not name a single known Bandit test id. LOW findings
        # are counted in the report metrics only, not gated.
        run: python bandit_gate.py
      - name: Check the known-id fallback against the installed Bandit
        # The unit jobs install no Bandit, so test_bandit_gate skips this exact
        # equality assertion there. This is the only job with the pinned
        # Bandit; running it here means a stale KNOWN_BANDIT_IDS fails CI
        # instead of drifting silently with a requirements-security bump.
        run: python -m unittest -v tests.test_bandit_gate.BanditGateTests.test_known_bandit_ids_covers_repo_and_matches_installed_bandit
      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: bandit-report
          path: app/bandit-report.json
          if-no-files-found: ignore
