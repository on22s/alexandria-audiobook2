name: security lint
on:
  pull_request:
  merge_group:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  bandit:
    name: bandit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: app/requirements-security.txt
      - name: Install pinned Bandit
        run: python -m pip install -r requirements-security.txt
      - name: Fail on new medium-or-higher findings
        # Reviewed findings already on main are in bandit-baseline.json; this
        # exits 1 only for a finding that is not in that baseline.
        run: >-
          bandit --ini bandit.ini -r -f json -o bandit-report.json
          -b bandit-baseline.json --severity-level medium
      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: bandit-report
          path: app/bandit-report.json
          if-no-files-found: ignore
