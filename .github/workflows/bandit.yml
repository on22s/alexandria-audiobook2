name: security lint
on:
  pull_request:
  merge_group:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  bandit:
    name: bandit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: app/requirements-security.txt
      - name: Install pinned Bandit
        run: python -m pip install -r requirements-security.txt
      - name: Fail on findings or unscannable files
        # Scans all of app/ plus the repo-root scripts, with no baseline file,
        # and fails on any medium-or-higher finding or any file bandit could
        # not parse or read. LOW findings are reported, not gated.
        run: python bandit_gate.py
      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: bandit-report
          path: app/bandit-report.json
          if-no-files-found: ignore
