name: tests

# Fast pre-merge gate: unit tests (mocked LLM/TTS) + the live API suite run
# against a disposable ALEXANDRIA_DATA_DIR. GPU/LLM-dependent `--full` tests are
# intentionally NOT run here — they need a real GPU + LM Studio and belong in a
# separate manual/self-hosted job.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: app/requirements.txt

      # This step has failed twice in two days without any code change: once
      # hanging 13 minutes on apt-get, once killed with SIGTERM (exit 143) at
      # 31 seconds. Both were runner/network flakiness, not the diff.
      #
      # libsndfile1 is deliberately not installed: the soundfile wheel bundles
      # its own libsndfile_x86_64.so, so the apt package was redundant. ffmpeg
      # is a real dependency for pydub's non-wav handling.
      - name: Cache ffmpeg package
        id: apt-cache
        uses: actions/cache@v5
        with:
          path: ~/apt-archives
          key: apt-ffmpeg-${{ runner.os }}-v1

      - name: Install system libraries (pydub)
        run: |
          set -euo pipefail
          # apt requires partial/ inside a custom archives dir.
          mkdir -p ~/apt-archives/partial
          if ls ~/apt-archives/*.deb >/dev/null 2>&1; then
            echo "Installing ffmpeg from cache ($(ls ~/apt-archives/*.deb | wc -l) packages)"
            sudo dpkg -i ~/apt-archives/*.deb || sudo apt-get install -f -y
          else
            # Retry: a single transient failure here should not fail the run.
            for attempt in 1 2 3; do
              if sudo apt-get update && \
                 sudo apt-get install -y --no-install-recommends \
                   -o Dir::Cache::archives="$HOME/apt-archives" ffmpeg; then
                break
              fi
              echo "apt attempt $attempt failed; retrying in $((attempt * 10))s"
              sleep $((attempt * 10))
            done
            sudo chown -R "$USER" ~/apt-archives || true
            rm -rf ~/apt-archives/partial ~/apt-archives/lock
          fi
          ffmpeg -version | head -1

      - name: Install Python dependencies
        # Structural adapter validation parses real PEFT configs and safetensors.
        # Install CPU Torch first so PEFT cannot pull a CUDA runtime into CI.
        # Launcher-managed production environments retain their platform build.
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'torch==2.10.0+cpu' 'torchaudio==2.10.0+cpu' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
          # Native EPUB fixtures and launcher hash enforcement use these CPU tools.
          python -m pip install 'EbookLib==0.20' 'beautifulsoup4==4.15.0' 'uv==0.11.14'
          python -c "import torch, torchaudio, peft; from safetensors import safe_open; assert torch.version.cuda is None and torch.version.hip is None; assert torchaudio.__version__.endswith('+cpu')"

      - name: Snapshot maintenance hints
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python diagnose_pr_changes.py --base "$BASE_SHA"

      - name: Verify experiment evidence indexes
        working-directory: .
        run: |
          python tools/audit/audit_experiment_artifacts.py --check
          python tools/audit/audit_legacy_attribution.py --check
          python tools/audit/collect_results.py --check

      - name: Shared release verifier
        id: verify
        run: python verify_release.py --json-report release-report.json

      - name: Diagnose whether failure exists on the base commit
        if: always() && github.event_name == 'pull_request' && steps.verify.outcome == 'failure'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          BASE_WORKTREE="${RUNNER_TEMP}/alexandria-base"
          git worktree add --detach "$BASE_WORKTREE" "$BASE_SHA"
          set +e
          (cd "$BASE_WORKTREE/app" && python verify_release.py --json-report "${RUNNER_TEMP}/base-release-report.json")
          BASE_STATUS=$?
          set -e
          git worktree remove --force "$BASE_WORKTREE"
          if [ ! -f "${RUNNER_TEMP}/base-release-report.json" ]; then
            echo "::warning::Base verification was indeterminate because it produced no JSON report."
          elif [ "$BASE_STATUS" -eq 0 ]; then
            cp "${RUNNER_TEMP}/base-release-report.json" base-release-report.json
            echo "::error::The base commit passes; this pull request introduced the verifier failure."
          else
            cp "${RUNNER_TEMP}/base-release-report.json" base-release-report.json
            echo "::warning::The verifier also fails on the base commit; inspect both JSON reports."
          fi

      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: release-verification-report
          path: |
            app/release-report.json
            app/base-release-report.json
          if-no-files-found: warn

  windows-owner:
    runs-on: windows-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - name: Verify native Windows subprocess ownership
        env:
          PYTHONPATH: .
        run: python tests/native_windows_owner_checks.py
