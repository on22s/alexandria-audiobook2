name: mutation

# On-demand mutation testing (mutmut) for ONE app module and its test modules.
# Deliberately not in the required path: mutation runs take minutes to hours and
# depend on the module chosen. Trigger it from the Actions tab or:
#
#   gh workflow run mutation.yml -f module=dialogue_spans \
#       -f tests="test_dialogue_spans test_pass_quality"
#
# The report (report.txt, results.txt, survivors.diff) is uploaded as an
# artifact. tools/mutation_check.sh can be run locally with the same arguments;
# it copies app/ to a scratch tree, so the checkout is never mutated in place.
on:
  workflow_dispatch:
    inputs:
      module:
        description: "app/ module to mutate (e.g. dialogue_spans or app/dialogue_spans.py)"
        required: true
        type: string
      tests:
        description: "space-separated test modules (e.g. test_dialogue_spans test_pass_quality)"
        required: true
        type: string

concurrency:
  group: mutation-${{ github.ref }}-${{ inputs.module }}
  cancel-in-progress: false

jobs:
  mutation:
    runs-on: ubuntu-latest
    # A pathological module can take longer; raise this per run if needed.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            app/requirements.txt
            app/requirements-mutation.txt

      # The mutated test imports real app modules (generate_script, project,
      # routers, ...), so install the same runtime stack the unit shards use.
      # Torch first and CPU-only, exactly as .github/workflows/tests.yml does.
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'torch==2.10.0+cpu' 'torchaudio==2.10.0+cpu' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r app/requirements.txt
          python -m pip install -r app/requirements-mutation.txt

      - name: Run mutation check
        env:
          AA2_MUTATION_PYTHON: python
          AA2_MUTATION_REPORT_DIR: ${{ runner.temp }}/mutation-report
          MODULE: ${{ inputs.module }}
          TESTS: ${{ inputs.tests }}
        run: |
          set -euo pipefail
          # Word splitting is intended: TESTS is a space-separated list. The
          # wrapper accepts app/x.py, x.py and x for the module.
          # shellcheck disable=SC2086
          tools/mutation_check.sh "$MODULE" $TESTS

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: mutation-report-${{ github.run_id }}
          path: ${{ runner.temp }}/mutation-report
          if-no-files-found: warn
          retention-days: 30
