name: qwen read-aloud
on:
  pull_request:
    paths:
      - 'app/**'
      - 'alexandria_alignment/**'
      - '.github/workflows/qwen-readalong.yml'
permissions:
  contents: read
jobs:
  native:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Install CPU test dependencies
        run: >
          python -m pip install 'numpy==2.2.6' 'soundfile==0.14.0'
          'pydub==0.25.1' 'pydantic==2.14.1' 'Pillow==12.3.0' 'av==17.0.0'
          'fastapi==0.143.3' 'starlette==1.3.1' 'aiofiles==24.1.0'
          'httpx==0.28.1' 'httpx2>=2.12.0,<3' 'python-multipart==0.0.32'
          'gradio_client==2.0.3' 'requests==2.34.2' 'openai==3.33.0'
          'rapidfuzz==3.14.5'
      - name: Detect Linux decoder dependencies
        id: codec-deps
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          . /etc/os-release
          printf 'image=%s-%s\n' "$ID" "$VERSION_ID" >> "$GITHUB_OUTPUT"
          if command -v ffmpeg && command -v ffprobe; then
            printf 'needed=false\n' >> "$GITHUB_OUTPUT"
          else
            printf 'needed=true\n' >> "$GITHUB_OUTPUT"
          fi
      - name: Cache FFmpeg packages on Linux
        if: runner.os == 'Linux' && steps.codec-deps.outputs.needed == 'true'
        uses: actions/cache@v5
        with:
          path: ~/apt-archives
          key: apt-ffmpeg-${{ steps.codec-deps.outputs.image }}-v1
      - name: Install FFmpeg on Linux
        if: runner.os == 'Linux' && steps.codec-deps.outputs.needed == 'true'
        run: |
          set -euo pipefail
          # Reuse the package cache and retry policy from tests.yml.
          mkdir -p ~/apt-archives/partial
          if ls ~/apt-archives/*.deb >/dev/null 2>&1; then
            sudo dpkg -i ~/apt-archives/*.deb || sudo apt-get install -f -y
          else
            for attempt in 1 2 3; do
              if sudo apt-get update && sudo apt-get install -y --no-install-recommends \
                  -o Dir::Cache::archives="$HOME/apt-archives" ffmpeg; then
                break
              fi
              echo "FFmpeg package setup attempt $attempt failed"
              if [ "$attempt" -lt 3 ]; then
                echo "Retrying FFmpeg package setup"
                sleep "$((attempt * 10))"
              fi
            done
            sudo chown -R "$USER" ~/apt-archives
            rm -rf ~/apt-archives/partial ~/apt-archives/lock
          fi
          command -v ffmpeg
          command -v ffprobe
      - name: Install FFmpeg on macOS
        if: runner.os == 'macOS'
        run: command -v ffmpeg && command -v ffprobe || brew install ffmpeg
      - name: Install FFmpeg on Windows
        if: runner.os == 'Windows'
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue) -or
              -not (Get-Command ffprobe -ErrorAction SilentlyContinue)) {
            choco install ffmpeg --no-progress -y
          }
      - name: Verify audio decoder executables
        run: python -c "import shutil, subprocess; paths = [shutil.which(name) for name in ('ffmpeg', 'ffprobe')]; assert all(paths), paths; [subprocess.run([path, '-version'], check=True) for path in paths]"
      - name: Qwen pure + IPC + sentence + route suites (no model, no billable, no GPU)
        env:
          PYTHONUTF8: '1'
          PYTHONIOENCODING: 'utf-8'
          PYTHONOPTIMIZE: '0'
        run: >
          python -m unittest tests.test_qwen_align tests.test_qwen_runtime
          tests.test_qwen_worker tests.test_epub_readaloud_sentences
          tests.test_readalong_qwen tests.test_qwen_scenarios
          tests.test_qwen_repairs tests.test_qwen_route_repairs
          tests.test_inline_ids tests.test_qwen_runtime_identity
          tests.test_epub_readaloud tests.test_epub_readaloud_conformance
          tests.test_readalong_r2 tests.test_readalong_r4
          tests.test_book_workspace_js tests.test_local_ui_assets -v
