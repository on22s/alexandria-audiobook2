name: source upload publication
on:
  pull_request:
    paths:
      - 'app/source_upload_publication.py'
      - 'app/source_upload_stage.py'
      - 'app/publication_source.py'
      - 'app/adapter_publication.py'
      - 'app/routers/script.py'
      - 'app/book_state_transaction.py'
      - 'app/tests/test_book_state_transaction.py'
      - 'app/tests/test_book_state_transaction_1660_compensation_race.py'
      - 'app/tests/test_book_state_streaming.py'
      - 'app/tests/test_source_upload_publication.py'
      - 'app/tests/test_source_upload_stage.py'
      - '.github/workflows/source-upload-publication.yml'
permissions:
  contents: read
jobs:
  native:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Verify native exclusive publication and process-death boundaries
        run: python -S -m unittest tests.test_source_upload_publication tests.test_source_upload_stage tests.test_book_state_transaction_1660_compensation_race.BookStateTransaction1660RecoveryCauseTests -v
      - name: Verify POSIX book move compensation fence (stdlib only)
        if: runner.os != 'Windows'
        run: python -S -m unittest tests.test_book_state_transaction_1660_compensation_race tests.test_book_state_transaction.BookStateTransactionTests.test_relocated_move_parent_preserves_entries_and_fences_byte_and_stream_recovery tests.test_book_state_transaction.BookStateTransactionTests.test_root_relocation_during_staging_cannot_publish_into_replacement_path tests.test_book_state_streaming.BookStateStreamingTests.test_parent_relocated_after_open_is_reported_and_evidence_preserved -v
