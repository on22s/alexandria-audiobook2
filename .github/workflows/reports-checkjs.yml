name: reports checkJs
on:
  pull_request:
    paths:
      - 'app/static/js/app-reports.js'
      - 'app/static/js/app-core.js'
      - 'app/static/index.html'
      - 'app/tests/test_report_explanation_js.py'
      - 'app/tests/test_benchmark_ui_js.py'
      - 'app/tests/test_benchmark_shared_polling_js.py'
      - 'tools/typecheck/**'
      - '.github/workflows/reports-checkjs.yml'
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '26'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Install pinned checker only
        working-directory: tools/typecheck
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate exact candidate and runtime fixtures
        run: npm --prefix tools/typecheck run check
      - name: Existing report and polling runtime tests
        working-directory: app
        run: python -m unittest tests.test_report_explanation_js tests.test_benchmark_ui_js tests.test_benchmark_shared_polling_js
