[package]
name = "aa2_ascii_native"
version = "0.1.0"
edition = "2021"
readme = "README.md"

[lib]
name = "aa2_ascii_native"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "=0.27.2", features = ["extension-module"] }

[build-dependencies]
pyo3-build-config = { version = "=0.27.2", features = ["resolve-config"] }

[profile.release]
opt-level = 3
